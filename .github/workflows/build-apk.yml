name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle with Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: |
          chmod +x frontend/android/gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies (Provides Capacitor Android core)
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Stage APK
        run: |
          mkdir -p release_apk
          find frontend/android -name "*.apk" -exec cp {} release_apk/SafeRoadAI.apk \;
          echo "=== Found APKs ==="
          ls -lh release_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeRoadAI-debug.apk
          path: release_apk/SafeRoadAI.apk
          retention-days: 14

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_apk/SafeRoadAI.apk
          tag_name: latest
          name: "SafeRoad AI Standalone App (Latest APK)"
          body: |
            ### SafeRoad AI Standalone Mobile App (Android APK)
            Click **SafeRoadAI.apk** below under Assets to download directly!
            
            - **100% Offline**: Runs on your phone with zero server, PC, or Wi-Fi needed.
            - **On-Device Computer Vision**: Potholes and cracks are scanned locally in ~50ms.
            - **Continuous GPS**: Real-time road hazard tracking and geofencing.
            - **Local Database**: Stores reports and repairs on your device.
          draft: false
          prerelease: false
