name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: |
          chmod +x frontend/android/gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies (Provides Capacitor Android core)
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload SafeRoad AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeRoadAI-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release (If tagged or dispatch)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          name: SafeRoad AI Standalone App ${{ github.ref_name }}
          body: |
            ### SafeRoad AI Standalone Mobile App (Android APK)
            - **100% Offline**: Runs with no PC, no server, and no Wi-Fi.
            - **On-Device AI**: Computer vision road damage detection.
            - **Continuous GPS**: Real-time road hazard tracking.
          draft: false
          prerelease: false
